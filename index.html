<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仁愛文理補習班</title>
<meta name="description" content="仁愛文理補習班 — 林口在地數學教學。">
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#12161c; --muted:#5b6673; --line:#e3e7ec;
    --bg:#fbfcfd; --accent:#e8622a; --accent-soft:#fdf0ea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .card{max-width:560px; width:100%}
  .mark{
    display:inline-flex; align-items:center; gap:10px;
    font-weight:700; letter-spacing:.02em; font-size:15px;
    color:var(--muted); margin-bottom:28px;
  }
  .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
  h1{font-size:clamp(28px,6vw,40px); line-height:1.25; margin:0 0 16px; letter-spacing:-.01em}
  p{color:var(--muted); margin:0 0 14px; font-size:16px}
  .rule{height:1px;background:var(--line);margin:28px 0}
  .tag{
    display:inline-block; background:var(--accent-soft); color:#b8431a;
    font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px;
    margin-bottom:20px;
  }
  footer{font-size:13px; color:#8b95a1; margin-top:32px}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><span class="dot"></span>仁愛文理補習班</div>
    <span class="tag">網站建置中</span>
    <h1>林口在地的數學教學，<br>把每個孩子的基礎打好。</h1>
    <p>這個網站正在建置中。課程資訊、上課時間與聯絡方式即將上線。</p>
    <p>若您想先了解課程，歡迎直接與我們聯繫。</p>
    <div class="rule"></div>
    <p style="font-size:14px">網站由 <a href="https://cootai.tw">CooTai 酷台</a> 建置</p>
    <footer>© 2026 仁愛文理補習班</footer>
  </main>
</body>
</html>
